<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SnowMail · 后台登录</title>
<meta name="description" content="SnowMail 多域名临时收信与 AI 接码工作台">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%2307080C'/%3E%3Crect x='3' y='3' width='8' height='8' rx='2' fill='%23FFFFFF'/%3E%3Crect x='13' y='3' width='8' height='8' rx='2' fill='%230038FF'/%3E%3Crect x='3' y='13' width='8' height='8' rx='2' fill='%23525866'/%3E%3Crect x='13' y='13' width='8' height='8' rx='2' fill='%23FFFFFF'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/snowmail-21st.css">
<script src="/snowmail-ui.js"></script>
<style>
.login-page {
  position: relative;
  isolation: isolate;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.shader-bg {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: -1;
}

.header-inner {
  max-width: 1200px;
  height: 100%;
  margin: 0 auto;
  padding: 0 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}

.header-right {
  display: flex;
  align-items: center;
  gap: 10px;
}

.stage {
  flex: 1;
  max-width: 1200px;
  width: 100%;
  margin: 0 auto;
  padding: 36px 24px 30px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
}

.hero-center {
  width: 100%;
  max-width: 580px;
  text-align: center;
  margin: auto 0;
}

.hero-center h1 {
  font-size: clamp(36px, 5.2vw, 60px);
  font-weight: 700;
  line-height: 1.06;
  letter-spacing: -0.038em;
  color: #FFFFFF;
  text-wrap: balance;
}

.hero-sub {
  margin-top: 16px;
  font-size: 16px;
  color: var(--fg-secondary);
  line-height: 1.6;
}

.entry-shell {
  margin: 32px auto 0;
  max-width: 470px;
  width: 100%;
}

.glass-bar-form {
  padding: 6px;
  border-radius: 15px;
  background: rgba(255, 255, 255, 0.065);
  border: 1px solid rgba(255, 255, 255, 0.12);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  box-shadow: 0 24px 64px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.12);
  display: flex;
  align-items: center;
  gap: 8px;
  transition: border-color 160ms ease, box-shadow 160ms ease;
}

.glass-bar-form:focus-within {
  border-color: rgba(59, 107, 255, 0.65);
  box-shadow: 0 24px 64px rgba(0, 0, 0, 0.62), 0 0 0 3px rgba(0, 56, 255, 0.24);
}

.bar-input {
  flex: 1;
  min-width: 0;
  height: 44px;
  padding: 0 14px;
  border: 0;
  background: transparent;
  color: #FFFFFF;
  font-family: inherit;
  font-size: 14px;
  outline: none;
}

.bar-input::placeholder {
  color: rgba(245, 246, 250, 0.42);
}

.peek-toggle {
  height: 30px;
  padding: 0 9px;
  border-radius: 7px;
  border: 1px solid rgba(255, 255, 255, 0.09);
  background: rgba(255, 255, 255, 0.05);
  color: var(--fg-muted);
  font-size: 11.5px;
  cursor: pointer;
  flex-shrink: 0;
}

.peek-toggle:hover {
  color: #FFFFFF;
  background: rgba(255, 255, 255, 0.1);
}

.bar-submit {
  height: 44px;
  padding: 0 22px;
  border-radius: 11px;
  flex-shrink: 0;
}

.mode-switch-row {
  margin-top: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
}

.error {
  display: none;
  margin-top: 14px;
  padding: 11px 14px;
  border-radius: 11px;
  background: var(--danger-bg);
  border: 1px solid var(--danger-border);
  color: #FECACA;
  font-size: 13px;
  text-align: left;
}

.error.show {
  display: block;
}

.bottom-status-row {
  padding-top: 24px;
  display: flex;
  justify-content: center;
  width: 100%;
}

@media (max-width: 560px) {
  .header-inner {
    padding: 0 16px;
  }
  .header-right .kbd-21 {
    display: none;
  }
  .stage {
    padding: 24px 18px 22px;
  }
  .glass-bar-form {
    flex-wrap: wrap;
    padding: 10px;
  }
  .bar-input {
    width: 100%;
    flex-basis: calc(100% - 64px);
  }
  .bar-submit {
    width: 100%;
  }
  .health-extra {
    display: none;
  }
}
</style>
</head>
<body>
<div class="login-page">
  <canvas id="cobalt-waves" class="shader-bg" aria-hidden="true"></canvas>

  <header class="glass-header">
    <div class="header-inner">
      <a class="brand-21" href="/">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <rect x="2" y="2" width="9" height="9" rx="2.2" fill="#FFFFFF"/>
          <rect x="13" y="2" width="9" height="9" rx="2.2" fill="#0038FF"/>
          <rect x="2" y="13" width="9" height="9" rx="2.2" fill="rgba(255,255,255,0.32)"/>
          <rect x="13" y="13" width="9" height="9" rx="2.2" fill="#FFFFFF"/>
        </svg>
        <span class="brand-21-name">SNOWMAIL</span>
      </a>

      <div class="header-right">
        <a class="btn-secondary" href="/verify.html" style="min-height:36px;padding:0 13px;font-size:13px;">
          <span>公开邮箱查收</span>
          <span class="kbd-21">⌘K</span>
        </a>
      </div>
    </div>
  </header>

  <main class="stage">
    <div aria-hidden="true"></div>

    <section class="hero-center">
      <h1>Just create &amp; catch<br>every verification.</h1>
      <p class="hero-sub" id="hero-sub">输入主管理员密码或 AI 操作密码进入收件工作台。</p>

      <div class="entry-shell">
        <form id="login-form" class="glass-bar-form" novalidate>
          <input
            id="password"
            class="bar-input"
            type="password"
            aria-label="登录密码"
            placeholder="请输入主管理员密码或 smop_ 操作密码..."
            autocomplete="current-password"
            required
          >
          <button id="peek-btn" class="peek-toggle" type="button">显示</button>
          <button id="submit" class="btn-primary bar-submit" type="submit">进入后台</button>
        </form>

        <form id="public-quick-form" class="glass-bar-form" hidden novalidate>
          <input
            id="public-address"
            class="bar-input mono"
            type="email"
            aria-label="公开邮箱地址"
            placeholder="输入已分享的完整邮箱，例如 user@example.com"
            autocomplete="off"
            spellcheck="false"
            required
          >
          <button id="public-submit" class="btn-primary bar-submit" type="submit">查看该邮箱</button>
        </form>

        <div class="error" id="error" role="alert"></div>

        <div class="mode-switch-row">
          <button id="switch-mode-btn" class="btn-secondary" type="button" style="min-height:36px;padding:0 16px;font-size:13px;">
            只看某个公开分享邮箱 →
          </button>
        </div>
      </div>
    </section>

    <footer class="bottom-status-row">
      <div id="health-pill" class="health-pill" role="status" aria-live="polite">
        <span style="display:inline-flex;align-items:center;gap:8px;color:#F5F6FA;">
          <span class="lime-dot pulse"></span>
          <span>服务在线</span>
        </span>
        <span class="sep">·</span>
        <span>正在读取运行状态...</span>
      </div>
    </footer>
  </main>
</div>

<script>
const form = document.getElementById('login-form');
const publicForm = document.getElementById('public-quick-form');
const passwordInput = document.getElementById('password');
const publicInput = document.getElementById('public-address');
const peekBtn = document.getElementById('peek-btn');
const submitButton = document.getElementById('submit');
const publicSubmit = document.getElementById('public-submit');
const switchModeBtn = document.getElementById('switch-mode-btn');
const heroSub = document.getElementById('hero-sub');
const errorBox = document.getElementById('error');

let publicMode = false;

function showError(message) {
  errorBox.textContent = message;
  errorBox.classList.add('show');
}

function clearError() {
  errorBox.textContent = '';
  errorBox.classList.remove('show');
}

function toggleEntryMode(forcePublic) {
  publicMode = typeof forcePublic === 'boolean' ? forcePublic : !publicMode;
  clearError();
  form.hidden = publicMode;
  publicForm.hidden = !publicMode;
  heroSub.textContent = publicMode
    ? '输入管理员分享给你的完整邮箱地址，只查看该信箱收件。'
    : '输入主管理员密码或 AI 操作密码进入收件工作台。';
  switchModeBtn.textContent = publicMode
    ? '← 返回管理员密码登录'
    : '只看某个公开分享邮箱 →';
  (publicMode ? publicInput : passwordInput).focus();
}

peekBtn.addEventListener('click', () => {
  const isText = passwordInput.type === 'text';
  passwordInput.type = isText ? 'password' : 'text';
  peekBtn.textContent = isText ? '显示' : '隐藏';
  passwordInput.focus();
});

switchModeBtn.addEventListener('click', () => toggleEntryMode());

document.addEventListener('keydown', event => {
  if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === 'k') {
    event.preventDefault();
    toggleEntryMode(true);
  }
});

form.addEventListener('submit', async event => {
  event.preventDefault();
  clearError();
  const password = passwordInput.value.trim();

  if (!password) {
    showError('请输入登录密码。');
    passwordInput.focus();
    return;
  }

  submitButton.disabled = true;
  submitButton.textContent = '验证中...';

  try {
    const response = await fetch('/api/admin/login', {
      method: 'POST',
      credentials: 'same-origin',
      cache: 'no-store',
      headers: {
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({ password }),
    });

    const data = await response.json();
    if (!response.ok) {
      throw new Error(response.status === 401 ? '密码无效或已撤销，请检查后重试。' : data.error || '登录失败');
    }

    window.location.href = '/admin';
  } catch (error) {
    showError(error.message || '登录失败，请稍后再试。');
    submitButton.disabled = false;
    submitButton.textContent = '进入后台';
    passwordInput.focus();
    passwordInput.select();
  }
});

publicForm.addEventListener('submit', async event => {
  event.preventDefault();
  clearError();
  const address = String(publicInput.value || '').trim().replace(/\s+/g, '').toLowerCase();

  if (!address || !address.includes('@')) {
    showError('请输入完整的邮箱地址。');
    publicInput.focus();
    return;
  }

  publicSubmit.disabled = true;
  publicSubmit.textContent = '验证中...';

  try {
    const response = await fetch(`/api/public/mailbox/${encodeURIComponent(address)}/meta`, { cache: 'no-store' });
    const data = await response.json();
    if (!response.ok) {
      throw new Error(response.status === 404 ? '这个邮箱不存在或已过期。' : data.error || '暂时无法打开该邮箱。');
    }
    try { sessionStorage.setItem('snowmail_last_public_address', data.address); } catch {}
    window.location.href = `/mailbox.html?address=${encodeURIComponent(data.address)}`;
  } catch (error) {
    showError(error.message || '验证失败，请稍后再试。');
    publicSubmit.disabled = false;
    publicSubmit.textContent = '查看该邮箱';
  }
});
</script>
</body>
</html>
